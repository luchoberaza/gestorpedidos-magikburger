<!doctype html>
<html lang="es" data-theme="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magik</title>
  <link rel="icon" href="/marca/logo">
  <script>try{var t=localStorage.getItem("mb_tema");if(t)document.documentElement.setAttribute("data-theme",t==="claro"?"claro":"oscuro");}catch(e){}</script>
  <style>
    @font-face { font-family: "Poppins"; font-weight: 400 500; font-display: swap; src: url("/static/Poppins-Regular.ttf") format("truetype"); }
    @font-face { font-family: "Poppins"; font-weight: 600; font-display: swap; src: url("/static/Poppins-SemiBold.ttf") format("truetype"); }
    @font-face { font-family: "Poppins"; font-weight: 700 900; font-display: swap; src: url("/static/Poppins-Bold.ttf") format("truetype"); }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='dist/app.css') }}?v={{ version }}">
</head>
<body>
  <div id="root"></div>
  <script src="{{ url_for('static', filename='dist/app.js') }}?v={{ version }}"></script>
</body>
</html>
